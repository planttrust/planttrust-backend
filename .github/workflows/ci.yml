# PlanTrust Backend CI — Unit Tests & Integration Smoke Tests
#
# Runs on every PR targeting develop or main.
# Each module runs its own unit tests independently, then the integration
# smoke test spins up all backend services and hits cross-module endpoints.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  DATABASE_URL: postgres://planttrust:planttrust_dev@localhost:5432/planttrust
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-test-secret
  NODE_ENV: test

jobs:
  # ─── Per-Module Unit Tests (run in parallel) ──────────────────────────
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module:
          - module-1-user-management
          - module-2-marketplace
          - module-3-mcp-ai
          - module-4-company-geofencing
          - module-5-blockchain-audit

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planttrust
          POSTGRES_PASSWORD: planttrust_dev
          POSTGRES_DB: planttrust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planttrust"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.module }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.module }}

      - name: Run unit tests
        run: npm test
        working-directory: ${{ matrix.module }}

  # ─── Integration Smoke Tests (backend-only) ───────────────────────────
  integration:
    runs-on: ubuntu-24.04
    needs: unit-tests

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v5

      - name: Trust all git directories
        run: git config --global --add safe.directory '*'

      - name: Start all services
        run: docker compose up -d --build --wait db redis module-1 module-2 module-3 module-4 module-5
        timeout-minutes: 10

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for all services to respond..."
          for port in 3001 3002 3003 3004 3005; do
            echo "Checking port $port..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:$port/health > /dev/null 2>&1; then
                echo "  Port $port is up"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "  Port $port failed to respond"
                docker compose logs
                exit 1
              fi
              sleep 2
            done
          done

      # TODO: Uncomment when Module 5's /api/audit/anchor endpoint is built (Checkpoint 2)
      # - name: Smoke test — Module 5 anchor endpoint
      #   run: |
      #     RESPONSE=$(curl -sf -X POST http://localhost:3005/api/audit/anchor \
      #       -H "Content-Type: application/json" \
      #       -d '{"sourceModule":"module-1","eventType":"ci_test","dataHash":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}')
      #     echo "Anchor response: $RESPONSE"
      #     echo "$RESPONSE" | jq -e '.anchorId' > /dev/null

      - name: Smoke test — All modules healthy
        run: |
          for port in 3001 3002 3003 3004 3005; do
            echo "Checking module on port $port..."
            curl -sf http://localhost:$port/health | jq -e '.status == "ok"'
          done

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
