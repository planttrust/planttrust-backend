# PlanTrust Backend CI — Unit Tests & Integration Smoke Tests
#
# Runs on every PR targeting develop or main.
# Tests run against the unified backend service.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  DATABASE_URL: postgres://planttrust:planttrust_dev@localhost:5432/planttrust
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-test-secret
  NODE_ENV: test

jobs:
  # ─── Unit Tests ────────────────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planttrust
          POSTGRES_PASSWORD: planttrust_dev
          POSTGRES_DB: planttrust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planttrust"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ─── Integration Smoke Tests (Docker) ──────────────────────────────────
  integration:
    runs-on: ubuntu-24.04
    needs: unit-tests

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v5

      - name: Trust all git directories
        run: git config --global --add safe.directory '*'

      - name: Start all services
        run: docker compose up -d --build --wait db redis backend
        timeout-minutes: 10

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend to respond..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "  Backend is up"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "  Backend failed to respond"
              docker compose logs
              exit 1
            fi
            sleep 2
          done

      - name: Smoke test — Backend healthy
        run: |
          echo "Checking backend health..."
          curl -sf http://localhost:3000/health | jq -e '.status == "ok"'

      - name: Smoke test — All module routes reachable
        run: |
          for route in auth/login documents certificates escrow listings transfers mcp chatbot scam projects reports geofence audit trust-index verify; do
            echo "Checking /api/$route..."
            curl -sf http://localhost:3000/api/$route > /dev/null 2>&1 || \
            curl -sf -X POST http://localhost:3000/api/$route > /dev/null 2>&1 || \
            echo "  Warning: /api/$route may require specific method/body"
          done

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
