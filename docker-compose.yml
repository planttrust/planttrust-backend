name: planttrust

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planttrust
      POSTGRES_PASSWORD: planttrust
      POSTGRES_DB: planttrust
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planttrust -d planttrust']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ['full']
    build:
      context: .
      target: build
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://planttrust:planttrust@db:5432/planttrust

  backend:
    profiles: ['full']
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://planttrust:planttrust@db:5432/planttrust
      JWT_SECRET: ${JWT_SECRET:-docker-local-secret-change-me}
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'

volumes:
  db-data:
