# PlanTrust â€” Docker Compose
# Starts the unified backend, the frontend, the shared database, and Redis.
#
# Prerequisites:
#   Both repos must be cloned side-by-side:
#     parent-dir/
#     â”œâ”€â”€ planttrust-backend/    (this repo â€” backend)
#     â””â”€â”€ planttrust-frontend/   (frontend repo)
#
# Usage: docker-compose up (from this repo's root)

services:
  # â”€â”€â”€ Shared Infrastructure â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  db:
    image: postgres:16-alpine
    container_name: planttrust-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: planttrust
      POSTGRES_PASSWORD: planttrust_dev
      POSTGRES_DB: planttrust
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planttrust"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: planttrust-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # â”€â”€â”€ Backend: Unified Node.js Server â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planttrust-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://planttrust:planttrust_dev@db:5432/planttrust
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-prod
      XRPL_NETWORK: wss://s.altnet.rippletest.net:51233
      XRPL_WALLET_SEED: ${XRPL_WALLET_SEED:-sEdxxxxxxxxxxxxxxxxxxxxxxxxx}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # â”€â”€â”€ Frontend: Next.js App (from GHCR) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  frontend:
    image: ghcr.io/planttrust/planttrust-frontend:latest
    container_name: planttrust-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000

volumes:
  pg_data:

